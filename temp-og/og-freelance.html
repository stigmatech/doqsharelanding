<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 630px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      position: relative;
      overflow: hidden;
    }
    
    /* Pattern de points subtil comme sur la homepage */
    .background-pattern {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.03;
      background-image: 
        radial-gradient(circle at 2px 2px, #6b7280 1px, transparent 0);
      background-size: 40px 40px;
    }
    
    .content {
      z-index: 1;
      text-align: center;
      max-width: 900px;
      width: 100%;
    }
    
    /* Badge SOC2, HIPAA & GDPR Compliant */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1f2937;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    
    /* Logo DoQshare */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .logo-square {
      width: 48px;
      height: 48px;
      background: #2563eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: 800;
    }
    .logo-text {
      font-size: 32px;
      font-weight: 800;
      color: #1e40af;
      letter-spacing: -0.5px;
    }
    
    /* Titre principal */
    .title {
      font-size: 64px;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 20px;
      line-height: 1.1;
      letter-spacing: -2px;
    }
    
    /* Sous-titre */
    .subtitle {
      font-size: 28px;
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 32px;
      line-height: 1.3;
    }
    
    /* Description */
    .description {
      font-size: 20px;
      color: #6b7280;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto 40px;
    }
    
    /* Features avec checkmarks */
    .features {
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      color: #4b5563;
    }
    .checkmark {
      width: 20px;
      height: 20px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
    
    /* Boutons CTA */
    .cta-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-secondary {
      background: white;
      color: #1f2937;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="background-pattern"></div>
  
  <div class="content">
    <div class="badge">
      SOC2, HIPAA & GDPR Compliant →
    </div>
    
    <div class="logo">
      <div class="logo-square">D</div>
      <div class="logo-text">DoQshare</div>
    </div>
    
    <h1 class="title">For Freelancers</h1>
    <p class="subtitle">Professional Document Sharing</p>
    <p class="description">Share proposals, contracts, and deliverables securely with clients</p>
    
    <div class="features">
      <div class="feature">
        <div class="checkmark">✓</div>
        <span>Zero-Knowledge Architecture</span>
      </div>
      <div class="feature">
        <div class="checkmark">✓</div>
        <span>14-Day Free Trial</span>
      </div>
      <div class="feature">
        <div class="checkmark">✓</div>
        <span>No Credit Card Required</span>
      </div>
    </div>
    
    <div class="cta-buttons">
      <button class="btn-primary">
        Start Free Trial →
      </button>
      <button class="btn-secondary">
        Schedule Demo ▶
      </button>
    </div>
  </div>
</body>
</html>
